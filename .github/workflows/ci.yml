name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test --ci
      - run: npx prettier --check src __tests__
      # Витрина веб-слоя: собирается в чистом Vite + Tailwind, как веб-приложение
      - run: yarn gallery:build
