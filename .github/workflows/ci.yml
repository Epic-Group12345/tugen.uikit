name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test --ci
      - run: npx prettier --check src __tests__
      # css/tugen.css собирается из токенов: правка tokens.json без yarn css разошлась бы с RN
      - run: yarn css && git diff --exit-code css

  nim:
    runs-on: ubuntu-latest
    # Сторонний setup-nim-action получает GITHUB_TOKEN: только на чтение
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: jiro4989/setup-nim-action@189b145833368cc92f1e7b3e166a25a3e057a693 # v2.3.1
        with:
          nim-version: '2.2.12'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - run: nim js --hints:off --warningAsError:CStringConv:on --path:nim -o:example/settings.js example/settings.nim
      - run: nim js --hints:off --warningAsError:CStringConv:on --path:nim -o:example/gallery.js example/gallery.nim
